name: Test 829pr changes 

on:
  push:
    branches:
      - sapMachine
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-13, ubuntu-24.04-arm, windows-11-arm] 
        version: ['21', '21.0.5', '21.0', 'jbr17-b87.7', 'jbr-release-21.0.3b465.3', '11_0_11b1536.2', '21.0.5-ea']
        exclude:
          - os: windows-11-arm
            version: '11'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: priyagupta108/setup-java@fix-JetBrains-install
        with:
          distribution: 'jetbrains'
          java-version: ${{ matrix.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 

      - name: Verify Java version
        run: java -version