name: Reproduce Cache 400 Error

on:
  push:
    branches:
      - sapMachine
  workflow_dispatch:

jobs:
  test-setup-java-907:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Clear Java tool cache
        run: |
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk"
        shell: pwsh
      
      - name: Block adoptium API endpoints
        shell: pwsh
        run: |
          # Get IPs for api.adoptium.net
          $adoptiumIps = (Resolve-DnsName -Name api.adoptium.net).IPAddress

          # Block each IP
          foreach ($ip in $adoptiumIps) {
            Write-Host "Blocking IP: $ip"
            netsh advfirewall firewall add rule name="BlockAdoptiumAPI_$ip" dir=out action=block remoteip=$ip
          }

          # List current rules
          netsh advfirewall firewall show rule name=all | Select-String "BlockAdoptiumAPI"
      - name: Simulate ECONNREFUSED Error
        shell: pwsh
        run: |
          # Attempt to connect to a closed port on localhost
          $closedPort = "127.0.0.1:9999"
          try {
            $client = New-Object System.Net.Sockets.TcpClient
            $client.Connect("127.0.0.1", 9999)
          } catch {
            Write-Host "Simulated ECONNREFUSED error by connecting to $closedPort"
          }
      - name: Set up JDK 
        # uses: actions/setup-java@v5
        uses: priya-kinthali/setup-java@test-907
        with:
          distribution: temurin
          java-version: 17
        env:
          FORCE_TIMEOUT: 'true'
        timeout-minutes: 2 
