name: Reproduce Cache 400 Error

on:
  push:
    branches:
      - sapMachine
  workflow_dispatch:

jobs:
  test-setup-java-907:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Clear Java tool cache
        run: |
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk"
        shell: pwsh
      - name: Add invalid DNS entry
        run: |
          Add-Content -Path "C:\Windows\System32\drivers\etc\hosts" -Value "127.0.0.1 api.adoptium.net"
          Add-Content -Path "C:\Windows\System32\drivers\etc\hosts" -Value "127.0.0.1 maven.apache.org"
          Add-Content -Path "C:\Windows\System32\drivers\etc\hosts" -Value "127.0.0.1 repo1.maven.org"
        shell: pwsh
      - name: Simulate network timeout
        run: |
          Start-Sleep -Seconds 30
          Test-Connection -ComputerName "api.adoptium.net" -Count 1 -ErrorAction SilentlyContinue
        shell: pwsh
      - name: Set up JDK 
        # uses: actions/setup-java@v5
        uses: priya-kinthali/setup-java@test-907
        with:
          distribution: temurin
          java-version: 17
        env:
          TEST_NETWORK_FAILURE: 'true' # Custom environment variable to simulate network failure
        # env:
        #   TEST_NETWORK_FAILURE: 'true'
